[workspace]
resolver = "2"
members = ["crates/sim_core", "crates/fidenza_world"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "io-std", "signal"] }
anyhow = "1"
[profile.release]
debug = 1
