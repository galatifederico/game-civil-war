services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: thegame
      POSTGRES_PASSWORD: thegame
      POSTGRES_DB: thegame
    ports:
      # Host port 5433, not 5432: this machine already has another Postgres
      # container bound to 5432.
      - "5433:5432"
    volumes:
      - thegame_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - thegame_redis_data:/data

volumes:
  thegame_postgres_data:
  thegame_redis_data:
